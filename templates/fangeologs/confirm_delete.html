{% extends "base.html" %}
{% block title %}删除档位志{% endblock %}
{% block content %}
<div class="page-header">
  <h1>删除风机档位切换志</h1>
</div>
<div class="card">
  <p>确认删除「{{ object.garden.name }}」于 {{ object.switchedAt|date:"Y-m-d H:i" }} 的 {{ object.gear }} 档切换记录？</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">确认删除</button>
    <a class="btn btn-secondary" href="{% url 'fangeolog_list' %}">取消</a>
  </form>
</div>
{% endblock %}
